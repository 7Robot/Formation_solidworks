<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0b0f17"/>
  <text x="60" y="60" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">L'ORIGINE (0,0,0) ET LES LIGNES DE CONSTRUCTION (CENTERLINES)</text>
  <text x="60" y="83" fill="#ff7d00" font-family="monospace" font-size="13">TRAIT PLEIN = MATIÈRE 3D | TRAIT MIXTE TIRETE = SQUELETTE DE RÉFÉRENCE VIRTUEL</text>

  <!-- Ligne de construction axe vertical -->
  <line x1="480" y1="110" x2="480" y2="470" stroke="#f59e0b" stroke-width="2" stroke-dasharray="14,6,3,6"/>
  <text x="495" y="130" fill="#f59e0b" font-family="monospace" font-size="12">Axe de symétrie (Ligne de construction)</text>

  <!-- Origine Rouge au centre -->
  <circle cx="480" cy="290" r="9" fill="#ef4444"/>
  <circle cx="480" cy="290" r="3" fill="#ffffff"/>
  <text x="500" y="305" fill="#ef4444" font-family="monospace" font-size="14" font-weight="bold">Origine (0,0,0)</text>

  <!-- Ligne de construction horizontale vers perçage gauche -->
  <line x1="260" y1="290" x2="480" y2="290" stroke="#f59e0b" stroke-width="2" stroke-dasharray="14,6,3,6"/>
  <line x1="480" y1="290" x2="700" y2="290" stroke="#f59e0b" stroke-width="2" stroke-dasharray="14,6,3,6"/>

  <!-- Cercles de matière réels -->
  <circle cx="260" cy="290" r="45" fill="none" stroke="#f8fafc" stroke-width="3.5"/>
  <circle cx="260" cy="290" r="18" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="260" cy="290" r="4" fill="#38bdf8"/>
  <text x="210" y="225" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Trou gauche</text>

  <circle cx="700" cy="290" r="45" fill="none" stroke="#f8fafc" stroke-width="3.5"/>
  <circle cx="700" cy="290" r="18" fill="none" stroke="#f8fafc" stroke-width="3"/>
  <circle cx="700" cy="290" r="4" fill="#38bdf8"/>
  <text x="660" y="225" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Trou droit (Symétrique)</text>

  <!-- Cote d'entraxe moteur -->
  <line x1="260" y1="380" x2="700" y2="380" stroke="#38bdf8" stroke-width="2"/>
  <line x1="260" y1="340" x2="260" y2="400" stroke="#38bdf8" stroke-width="1"/>
  <line x1="700" y1="340" x2="700" y2="400" stroke="#38bdf8" stroke-width="1"/>
  <polygon points="260,380 272,376 272,384" fill="#38bdf8"/>
  <polygon points="700,380 688,376 688,384" fill="#38bdf8"/>
  <text x="440" y="405" fill="#38bdf8" font-family="monospace" font-size="15" font-weight="bold">Entraxe 120 mm</text>
</svg>