<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0b0f17"/>
  
  <!-- Grille CAD -->
  <defs>
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="960" height="540" fill="url(#gridPattern)"/>

  <!-- Titre -->
  <text x="60" y="65" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">ESQUISSE 2D - CERCLE CENTRÉ SUR L'ORIGINE &amp; COTE INTELLIGENTE</text>
  <text x="60" y="88" fill="#10b981" font-family="monospace" font-size="13">STATUT : TOTALEMENT CONTRAINT (LIGNE NOIRE)</text>

  <!-- Axes de construction traversants -->
  <line x1="160" y1="290" x2="800" y2="290" stroke="#64748b" stroke-width="1.5" stroke-dasharray="10,6,2,6"/>
  <line x1="480" y1="90" x2="480" y2="490" stroke="#64748b" stroke-width="1.5" stroke-dasharray="10,6,2,6"/>

  <!-- Cercle esquisse (NOIR - Totalement contraint) -->
  <circle cx="480" cy="290" r="140" fill="none" stroke="#0f172a" stroke-width="6"/>
  <circle cx="480" cy="290" r="140" fill="#38bdf8" fill-opacity="0.06" stroke="#f8fafc" stroke-width="3.5"/>

  <!-- Origine Rouge au centre -->
  <circle cx="480" cy="290" r="8" fill="#ef4444"/>
  <circle cx="480" cy="290" r="3" fill="#ffffff"/>
  <line x1="480" y1="290" x2="525" y2="290" stroke="#ef4444" stroke-width="2"/>
  <line x1="480" y1="290" x2="480" y2="245" stroke="#ef4444" stroke-width="2"/>

  <!-- Symbole de contrainte Coïncidence verte -->
  <rect x="495" y="295" width="22" height="22" rx="4" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="502" y="311" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">⧀</text>

  <!-- Ligne de cote intelligente (Smart Dimension) -->
  <line x1="381" y1="191" x2="270" y2="120" stroke="#38bdf8" stroke-width="2"/>
  <line x1="270" y1="120" x2="160" y2="120" stroke="#38bdf8" stroke-width="2"/>
  <circle cx="381" cy="191" r="4" fill="#38bdf8"/>

  <!-- Flèche double de diamètre -->
  <line x1="381" y1="191" x2="579" y2="389" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="381,191 395,200 390,205" fill="#38bdf8"/>
  <polygon points="579,389 565,380 570,375" fill="#38bdf8"/>

  <!-- Boîte de dialogue Modifier Cote (SolidWorks) -->
  <rect x="130" y="90" width="160" height="70" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" filter="drop-shadow(0 4px 6px rgba(0,0,0,0.5))"/>
  <rect x="130" y="90" width="160" height="22" rx="6" fill="#0284c7"/>
  <text x="140" y="106" fill="#ffffff" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Modifier : D1@Esquisse1</text>
  <text x="142" y="145" fill="#38bdf8" font-family="monospace" font-size="24" font-weight="bold">Ø 30.00</text>
  <text x="245" y="145" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">mm</text>

  <!-- Badge Statut -->
  <g transform="translate(680, 440)">
    <rect width="220" height="45" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="6" fill="#10b981"/>
    <text x="35" y="27" fill="#ecfdf5" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Totalement contraint</text>
  </g>
</svg>