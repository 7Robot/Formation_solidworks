<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0f172a"/>

  <!-- Cadre diplôme / badge or -->
  <rect x="120" y="40" width="720" height="460" rx="20" fill="#1e293b" stroke="#ff7d00" stroke-width="3"/>
  <rect x="135" y="55" width="690" height="430" rx="14" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Logo 7Robot au sommet -->
  <circle cx="480" cy="140" r="50" fill="#ff7d00" fill-opacity="0.15" stroke="#ff7d00" stroke-width="2.5"/>
  <text x="445" y="155" fill="#ff7d00" font-family="Inter, sans-serif" font-size="40" font-weight="900">7R</text>

  <text x="480" y="235" text-anchor="middle" fill="#f8fafc" font-family="Inter, sans-serif" font-size="24" font-weight="bold">ATTESTATION D'INITIATION CAO SOLIDWORKS</text>
  <text x="480" y="265" text-anchor="middle" fill="#ff7d00" font-family="monospace" font-size="14" font-weight="bold">ASSOCIATION DE ROBOTIQUE 7ROBOT - ENSEEIHT</text>

  <!-- Ligne de séparation -->
  <line x1="280" y1="290" x2="680" y2="290" stroke="#475569" stroke-width="1.5"/>

  <text x="480" y="330" text-anchor="middle" fill="#cbd5e1" font-family="Inter, sans-serif" font-size="15">
    A validé avec succès l'ensemble des modules d'ingénierie :
  </text>
  <text x="480" y="360" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="13">
    Esquisse 2D Contrainte • Extrusions &amp; Révolution 3D • Assemblage Mécatronique
  </text>
  <text x="480" y="385" text-anchor="middle" fill="#38bdf8" font-family="monospace" font-size="13">
    Intégration Servomoteur Feetech &amp; Détection d'interférences
  </text>

  <!-- Tampon homologation -->
  <g transform="translate(480, 440)">
    <rect x="-110" y="-20" width="220" height="40" rx="20" fill="#15803d" stroke="#22c55e" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" fill="#ffffff" font-family="Inter, sans-serif" font-size="13" font-weight="bold">✔ HOMOLOGUÉ 7ROBOT</text>
  </g>
</svg>