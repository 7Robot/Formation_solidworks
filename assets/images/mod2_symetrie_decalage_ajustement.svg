<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0b0f17"/>
  
  <text x="60" y="55" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">OUTILS D'ESQUISSE 2D : AJUSTEMENT (POWER TRIM), DÉCALAGE ET SYMÉTRIE</text>
  <text x="60" y="78" fill="#ff7d00" font-family="monospace" font-size="13">GAGNER DU TEMPS : COUPER D'UN GESTE, DOUBLER LES PAROIS ET RÉFLÉCHIR PAR SYMÉTRIE</text>

  <!-- 1. AJUSTEMENT ASSISTÉ (POWER TRIM) -->
  <g transform="translate(60, 105)">
    <rect width="400" height="185" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <rect width="400" height="34" rx="10" fill="#7f1d1d" fill-opacity="0.4"/>
    <text x="18" y="23" fill="#fca5a5" font-family="Inter, sans-serif" font-size="13" font-weight="bold">1. Ajustement assisté (Power Trim - Le coup de cutter)</text>

    <!-- Segments qui se croisent -->
    <line x1="80" y1="65" x2="260" y2="165" stroke="#f8fafc" stroke-width="3"/>
    <line x1="100" y1="165" x2="240" y2="65" stroke="#f8fafc" stroke-width="3"/>

    <!-- Tracé du Power Trim (ligne rouge de découpe) -->
    <path d="M 60 115 Q 170 145 280 110" fill="none" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="6,3"/>
    <circle cx="280" cy="110" r="5" fill="#ef4444"/>

    <!-- Petit curseur de ciseaux / cutter -->
    <g transform="translate(290, 95)">
      <rect width="75" height="24" rx="4" fill="#ef4444"/>
      <text x="8" y="16" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">Power Trim</text>
    </g>

    <text x="18" y="145" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">Faites glisser la souris clic gauche maintenu :</text>
    <text x="18" y="165" fill="#f87171" font-family="monospace" font-size="11">Tout segment traversé est coupé instantanément !</text>
  </g>

  <!-- 2. DÉCALER LES ENTITÉS (OFFSET) -->
  <g transform="translate(500, 105)">
    <rect width="400" height="185" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
    <rect width="400" height="34" rx="10" fill="#0369a1" fill-opacity="0.4"/>
    <text x="18" y="23" fill="#bae6fd" font-family="Inter, sans-serif" font-size="13" font-weight="bold">2. Décaler les entités (Offset - Parois constantes)</text>

    <!-- Contour original -->
    <rect x="70" y="65" width="200" height="75" rx="10" fill="none" stroke="#f8fafc" stroke-width="3"/>
    <text x="85" y="105" fill="#f8fafc" font-family="Inter, sans-serif" font-size="11">Contour initial</text>

    <!-- Contour décalé (Offset) -->
    <rect x="50" y="48" width="240" height="110" rx="14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="175" y="148" fill="#38bdf8" font-family="monospace" font-size="11">Offset : 3.0 mm</text>

    <line x1="270" y1="102" x2="290" y2="102" stroke="#ff7d00" stroke-width="2"/>
    <polygon points="270,102 276,99 276,105" fill="#ff7d00"/>
    <polygon points="290,102 284,99 284,105" fill="#ff7d00"/>

    <text x="18" y="175" fill="#bae6fd" font-family="Inter, sans-serif" font-size="11">Indispensable pour l'épaisseur de coque d'un boîtier FDM.</text>
  </g>

  <!-- 3. SYMÉTRIE D'ENTITÉS (MIRROR) -->
  <g transform="translate(60, 310)">
    <rect width="840" height="195" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <rect width="840" height="34" rx="10" fill="#065f46" fill-opacity="0.4"/>
    <text x="20" y="23" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="13" font-weight="bold">3. Symétrie d'esquisse (Mirror Entities - Moitié gauche dupliquée à droite)</text>

    <!-- Axe de symétrie central -->
    <line x1="420" y1="50" x2="420" y2="185" stroke="#f59e0b" stroke-width="2" stroke-dasharray="10,5,2,5"/>
    <text x="350" y="70" fill="#f59e0b" font-family="monospace" font-size="11">Axe de symétrie</text>

    <!-- Côté gauche (Dessiné) -->
    <g transform="translate(180, 50)">
      <path d="M 240 20 L 100 20 L 70 80 L 130 110 L 240 110" fill="none" stroke="#f8fafc" stroke-width="3"/>
      <circle cx="120" cy="65" r="14" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="40" y="70" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Dessiné (1/2)</text>
    </g>

    <!-- Flèche de symétrie -->
    <path d="M 390 120 Q 420 90 450 120" fill="none" stroke="#10b981" stroke-width="2.5"/>
    <polygon points="450,120 442,112 447,107" fill="#10b981"/>
    <text x="405" y="145" fill="#10b981" font-family="monospace" font-size="12" font-weight="bold">Mirror</text>

    <!-- Côté droit (Généré par symétrie) -->
    <g transform="translate(420, 50)">
      <path d="M 0 20 L 140 20 L 170 80 L 110 110 L 0 110" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="4,2"/>
      <circle cx="120" cy="65" r="14" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,2"/>
      <text x="140" y="70" fill="#10b981" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Symétrique automatique</text>
    </g>
  </g>
</svg>
