<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0b0f17"/>
  
  <text x="60" y="55" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">LE CODE COULEUR SOLIDWORKS : BLEU (DANGER) VS NOIR (VALIDÉ)</text>
  <text x="60" y="78" fill="#ef4444" font-family="monospace" font-size="13">RÈGLE D'OR 7ROBOT : AUCUNE ESQUISSE BLEUE N'EST ACCEPTÉE EN FABRICATION</text>

  <!-- Partie Gauche : BLEU / SOUS-CONTRAINT -->
  <g transform="translate(60, 100)">
    <rect width="400" height="380" rx="12" fill="#1e293b" stroke="#ef4444" stroke-width="2"/>
    <rect width="400" height="40" rx="10" fill="#7f1d1d"/>
    <text x="20" y="26" fill="#fecaca" font-family="Inter, sans-serif" font-size="13" font-weight="bold">❌ ESQUISSE BLEUE = SOUS-CONTRAINTE</text>

    <!-- Rectangle bleu flottant -->
    <rect x="80" y="90" width="220" height="130" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
    <circle cx="80" cy="90" r="5" fill="#38bdf8"/>
    <circle cx="300" cy="90" r="5" fill="#38bdf8"/>
    <circle cx="300" cy="220" r="5" fill="#38bdf8"/>
    <circle cx="80" cy="220" r="5" fill="#38bdf8"/>

    <!-- Origine rouge loin dans le coin (non liée !) -->
    <circle cx="40" cy="260" r="7" fill="#ef4444"/>
    <text x="25" y="285" fill="#ef4444" font-family="monospace" font-size="11">Origine (0,0)</text>

    <!-- Flèches d'instabilité -->
    <path d="M 315 150 Q 345 130 355 170" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="310" y="195" fill="#f59e0b" font-family="Inter, sans-serif" font-size="11">Bouge au clic !</text>

    <rect x="20" y="315" width="360" height="50" rx="6" fill="#0f172a"/>
    <text x="30" y="337" fill="#ef4444" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Risque robotique :</text>
    <text x="30" y="354" fill="#f87171" font-family="Inter, sans-serif" font-size="11">L'entraxe moteur peut glisser de 3 mm sans alerte !</text>
  </g>

  <!-- Partie Droite : NOIR / TOTALEMENT CONTRAINT -->
  <g transform="translate(500, 100)">
    <rect width="400" height="380" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="400" height="40" rx="10" fill="#064e3b"/>
    <text x="20" y="26" fill="#a7f3d0" font-family="Inter, sans-serif" font-size="13" font-weight="bold">✔ ESQUISSE NOIRE = TOTALEMENT CONTRAINTE</text>

    <!-- Rectangle noir ancré à l'origine avec cotes -->
    <rect x="100" y="110" width="200" height="120" fill="#10b981" fill-opacity="0.05" stroke="#f8fafc" stroke-width="3.5"/>
    <circle cx="100" cy="230" r="7" fill="#ef4444"/>
    <text x="50" y="250" fill="#ef4444" font-family="monospace" font-size="11">Origine liée</text>

    <!-- Cotes exactes -->
    <line x1="100" y1="85" x2="300" y2="85" stroke="#38bdf8" stroke-width="2"/>
    <line x1="100" y1="75" x2="100" y2="95" stroke="#38bdf8" stroke-width="1"/>
    <line x1="300" y1="75" x2="300" y2="95" stroke="#38bdf8" stroke-width="1"/>
    <text x="180" y="78" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">60.00 mm</text>

    <line x1="325" y1="110" x2="325" y2="230" stroke="#38bdf8" stroke-width="2"/>
    <line x1="315" y1="110" x2="335" y2="110" stroke="#38bdf8" stroke-width="1"/>
    <line x1="315" y1="230" x2="335" y2="230" stroke="#38bdf8" stroke-width="1"/>
    <text x="335" y="175" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="bold">40.00</text>

    <rect x="20" y="315" width="360" height="50" rx="6" fill="#0f172a"/>
    <text x="30" y="337" fill="#10b981" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Validation 7Robot :</text>
    <text x="30" y="354" fill="#6ee7b7" font-family="Inter, sans-serif" font-size="11">Prêt pour l'usinage CNC et l'impression 3D !</text>
  </g>
</svg>