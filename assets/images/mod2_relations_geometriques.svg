<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0b0f17"/>
  
  <text x="60" y="65" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">SOLIDWORKS - LES RELATIONS GÉOMÉTRIQUES INDISPENSABLES</text>
  <text x="60" y="88" fill="#38bdf8" font-family="monospace" font-size="13">SÉLECTIONNER AVEC [CTRL] ENFONCÉ &gt; CHOISIR LA RELATION DANS LE MENU FLOTTANT</text>

  <!-- 4 cartes illustrées des relations -->
  <!-- 1. Égalité -->
  <g transform="translate(60, 120)">
    <rect width="400" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#15803d"/>
    <text x="22" y="35" fill="#ffffff" font-family="monospace" font-size="18" font-weight="bold">=</text>
    <text x="55" y="34" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Égalité (Equal)</text>
    <text x="15" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Force plusieurs cercles ou segments à avoir la même taille.</text>
    <text x="15" y="85" fill="#22c55e" font-family="monospace" font-size="11">Cas 7Robot : 8 trous de vis M3 (1 seule cote suffit !)</text>

    <!-- Dessin cercles égaux -->
    <circle cx="120" cy="125" r="25" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="220" cy="125" r="25" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="320" cy="125" r="25" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <text x="170" y="130" fill="#22c55e" font-family="monospace" font-size="16" font-weight="bold">=</text>
    <text x="270" y="130" fill="#22c55e" font-family="monospace" font-size="16" font-weight="bold">=</text>
  </g>

  <!-- 2. Tangence -->
  <g transform="translate(500, 120)">
    <rect width="400" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#15803d"/>
    <text x="22" y="34" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">⌒</text>
    <text x="55" y="34" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Tangence (Tangent)</text>
    <text x="15" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Raccorde une droite et un arc sans aucune cassure.</text>
    <text x="15" y="85" fill="#22c55e" font-family="monospace" font-size="11">Cas 7Robot : Tendeurs de courroies, lumières oblongues</text>

    <!-- Dessin tangence -->
    <circle cx="150" cy="130" r="30" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="150" y1="100" x2="330" y2="100" stroke="#38bdf8" stroke-width="2.5"/>
    <rect x="140" y="90" width="20" height="20" rx="4" fill="#15803d"/>
    <text x="145" y="105" fill="#ffffff" font-family="monospace" font-size="12">⌒</text>
  </g>

  <!-- 3. Concentricité -->
  <g transform="translate(60, 310)">
    <rect width="400" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#15803d"/>
    <text x="22" y="34" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">◎</text>
    <text x="55" y="34" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Concentricité (Concentric)</text>
    <text x="15" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Aligne exactement le centre de deux cercles ou perçages.</text>
    <text x="15" y="85" fill="#22c55e" font-family="monospace" font-size="11">Cas 7Robot : Paliers, roulements à billes, axes moteurs</text>

    <!-- Dessin concentricité -->
    <circle cx="200" cy="125" r="35" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="200" cy="125" r="18" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="200" cy="125" r="3" fill="#ef4444"/>
    <rect x="215" y="115" width="20" height="20" rx="4" fill="#15803d"/>
    <text x="219" y="130" fill="#ffffff" font-family="monospace" font-size="12">◎</text>
  </g>

  <!-- 4. Alignement Horizontal / Vertical -->
  <g transform="translate(500, 310)">
    <rect width="400" height="170" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect x="15" y="15" width="28" height="28" rx="6" fill="#15803d"/>
    <text x="23" y="34" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">―</text>
    <text x="55" y="34" fill="#f8fafc" font-family="Inter, sans-serif" font-size="15" font-weight="bold">Horizontal / Vertical</text>
    <text x="15" y="65" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Verrouille deux points sur le même niveau X ou Y.</text>
    <text x="15" y="85" fill="#22c55e" font-family="monospace" font-size="11">Cas 7Robot : Entraxe de roues motrices gauche / droite</text>

    <!-- Dessin alignement -->
    <circle cx="100" cy="125" r="16" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <circle cx="300" cy="125" r="16" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
    <line x1="100" y1="125" x2="300" y2="125" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="6,4"/>
    <rect x="190" y="115" width="22" height="22" rx="4" fill="#15803d"/>
    <text x="195" y="131" fill="#ffffff" font-family="monospace" font-size="14">—</text>
  </g>
</svg>