<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="frontPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="topPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="rightPlaneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.08"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="#0f172a"/>
  
  <!-- Cadre technique & grille -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="40" y1="40" x2="920" y2="40"/>
    <line x1="40" y1="500" x2="920" y2="500"/>
    <line x1="40" y1="40" x2="40" y2="500"/>
    <line x1="920" y1="40" x2="920" y2="500"/>
  </g>

  <!-- Titre technique -->
  <text x="60" y="75" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">SOLIDWORKS - LES 3 PLANS DE RÉFÉRENCE CARTÉSIENS</text>
  <text x="60" y="98" fill="#ff7d00" font-family="monospace" font-size="13">SÉLECTION RECOMMANDÉE : PLAN DE FACE (FRONT PLANE)</text>

  <!-- Plan de Dessus (Top Plane) -->
  <polygon points="260,340 700,340 560,450 120,450" fill="url(#topPlaneGrad)" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="210" y="430" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14" font-weight="600">Plan de Dessus (Sol / Table de jeu)</text>

  <!-- Plan de Droite (Right Plane) -->
  <polygon points="480,120 480,410 320,480 320,190" fill="url(#rightPlaneGrad)" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="325" y="180" fill="#94a3b8" font-family="Inter, sans-serif" font-size="14" font-weight="600">Plan de Droite</text>

  <!-- Plan de Face (Front Plane) - MIS EN AVANT -->
  <polygon points="240,140 740,140 740,430 240,430" fill="url(#frontPlaneGrad)" stroke="#0284c7" stroke-width="3"/>
  <rect x="236" y="136" width="8" height="8" fill="#38bdf8"/>
  <rect x="736" y="136" width="8" height="8" fill="#38bdf8"/>
  <rect x="736" y="426" width="8" height="8" fill="#38bdf8"/>
  <rect x="236" y="426" width="8" height="8" fill="#38bdf8"/>
  
  <text x="260" y="170" fill="#38bdf8" font-family="Inter, sans-serif" font-size="16" font-weight="bold">★ PLAN DE FACE (SÉLECTIONNÉ)</text>
  <text x="260" y="195" fill="#bae6fd" font-family="monospace" font-size="12">Clic droit > Nouvelle Esquisse (Ctrl+8 pour vue normale)</text>

  <!-- Origine Rouge (0,0,0) -->
  <circle cx="480" cy="285" r="7" fill="#ef4444"/>
  <line x1="480" y1="285" x2="550" y2="285" stroke="#ef4444" stroke-width="3"/>
  <polygon points="550,281 560,285 550,289" fill="#ef4444"/>
  <text x="565" y="290" fill="#ef4444" font-family="monospace" font-size="13" font-weight="bold">X</text>

  <line x1="480" y1="285" x2="480" y2="215" stroke="#ef4444" stroke-width="3"/>
  <polygon points="476,215 480,205 484,215" fill="#ef4444"/>
  <text x="485" y="210" fill="#ef4444" font-family="monospace" font-size="13" font-weight="bold">Y</text>

  <circle cx="480" cy="285" r="3" fill="#ffffff"/>
  <text x="495" y="315" fill="#fca5a5" font-family="monospace" font-size="12" font-weight="bold">Origine (0,0,0)</text>

  <!-- Note pédagogique -->
  <rect x="680" y="430" width="220" height="55" rx="8" fill="#1e293b" stroke="#ff7d00" stroke-width="1.5"/>
  <text x="695" y="455" fill="#ff7d00" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Raccourci 7Robot :</text>
  <text x="695" y="473" fill="#f1f5f9" font-family="monospace" font-size="13">Ctrl + 8 = Vue Normale</text>
</svg>