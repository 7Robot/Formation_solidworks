<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0f172a"/>
  
  <text x="60" y="60" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">ASSEMBLAGE : CONTRAINTES MÉCANIQUES SUR SERVOMOTEUR FEETECH</text>
  <text x="60" y="83" fill="#ff7d00" font-family="monospace" font-size="13">MÉTHODE ISOSTATIQUE : 1 COÏNCIDENCE (APPUI PLAN) + 2 CONCENTRICITÉS (VIS M3)</text>

  <!-- Platine du châssis robot (Gris foncé) -->
  <g transform="translate(180, 240)">
    <polygon points="40,60 560,60 520,180 0,180" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="440" y="165" fill="#94a3b8" font-family="Inter, sans-serif" font-size="12">Platine Châssis (Fixe)</text>

    <!-- Trous de vis taraudés M3 sur la platine -->
    <ellipse cx="140" cy="120" rx="14" ry="7" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
    <ellipse cx="380" cy="120" rx="14" ry="7" fill="#0f172a" stroke="#0284c7" stroke-width="2"/>
  </g>

  <!-- Servomoteur Feetech (Orange / Noir) en approche -->
  <g transform="translate(240, 110)">
    <!-- Boîtier servo -->
    <rect x="60" y="40" width="200" height="110" rx="8" fill="#1e293b" stroke="#ff7d00" stroke-width="2"/>
    <rect x="60" y="70" width="200" height="50" fill="#ff7d00" fill-opacity="0.15"/>
    <text x="120" y="100" fill="#ff7d00" font-family="monospace" font-size="14" font-weight="bold">FEETECH STS3215</text>

    <!-- Oreilles de fixation avec trous M3 -->
    <rect x="20" y="115" width="280" height="15" rx="3" fill="#334155" stroke="#64748b" stroke-width="1.5"/>
    <circle cx="40" cy="122" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="280" cy="122" r="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>

    <!-- Axe cannelé de sortie et palonnier -->
    <rect x="80" y="15" width="30" height="25" fill="#94a3b8" stroke="#f8fafc" stroke-width="1.5"/>
    <circle cx="95" cy="15" r="18" fill="#e2e8f0" stroke="#ff7d00" stroke-width="2"/>
    <circle cx="95" cy="15" r="5" fill="#0f172a"/>
  </g>

  <!-- Ligne de Coïncidence 1 (Faces planes en contact) -->
  <line x1="240" y1="240" x2="540" y2="240" stroke="#22c55e" stroke-width="3" stroke-dasharray="6,4"/>
  <rect x="555" y="225" width="230" height="34" rx="6" fill="#064e3b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="565" y="247" fill="#86efac" font-family="Inter, sans-serif" font-size="12" font-weight="bold">1. Coïncidence (Appui plan)</text>

  <!-- Lignes d'axes de Concentricité 2 & 3 (Trous de vis M3) -->
  <line x1="280" y1="230" x2="320" y2="360" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,2"/>
  <rect x="60" y="325" width="210" height="34" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="70" y="347" fill="#bae6fd" font-family="Inter, sans-serif" font-size="12" font-weight="bold">2. Concentricité Vis 1 (M3)</text>

  <line x1="520" y1="230" x2="560" y2="360" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,2"/>
  <rect x="555" y="325" width="210" height="34" rx="6" fill="#0c4a6e" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="565" y="347" fill="#bae6fd" font-family="Inter, sans-serif" font-size="12" font-weight="bold">3. Concentricité Vis 2 (M3)</text>
</svg>