<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <rect width="960" height="540" fill="#0f172a"/>

  <!-- Titre -->
  <text x="60" y="65" fill="#f8fafc" font-family="Inter, sans-serif" font-size="18" font-weight="bold">FONCTION 3D : BOSSAGE / BASE EXTRUDÉ (CYLINDRE Ø30 x 50 mm)</text>
  <text x="60" y="88" fill="#ff7d00" font-family="monospace" font-size="13">CONDITION DE FIN : PLAN MILIEU (MID PLANE) - SYMÉTRIE RESPECTÉE</text>

  <!-- Volet PropertyManager (Gauche) -->
  <g transform="translate(60, 110)">
    <rect width="240" height="380" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <rect width="240" height="36" rx="8" fill="#334155"/>
    <text x="15" y="24" fill="#f8fafc" font-family="Inter, sans-serif" font-size="13" font-weight="bold">Bossage-Extru1</text>
    
    <!-- Boutons vert et rouge -->
    <circle cx="200" cy="18" r="8" fill="#22c55e"/>
    <circle cx="222" cy="18" r="8" fill="#ef4444"/>

    <text x="15" y="70" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Direction 1</text>
    <rect x="15" y="80" width="210" height="32" rx="6" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
    <text x="25" y="101" fill="#38bdf8" font-family="Inter, sans-serif" font-size="12" font-weight="bold">Plan Milieu (Mid Plane)</text>

    <text x="15" y="140" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Profondeur (D1)</text>
    <rect x="15" y="150" width="210" height="34" rx="6" fill="#0f172a" stroke="#ff7d00" stroke-width="1.5"/>
    <text x="25" y="173" fill="#ff7d00" font-family="monospace" font-size="15" font-weight="bold">50.00 mm</text>

    <rect x="15" y="220" width="210" height="130" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="25" y="245" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="11" font-weight="bold">Astuce 7Robot :</text>
    <text x="25" y="268" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">En 'Plan Milieu', la pièce</text>
    <text x="25" y="286" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">avance de 25mm devant</text>
    <text x="25" y="304" fill="#94a3b8" font-family="Inter, sans-serif" font-size="11">et 25mm derrière.</text>
    <text x="25" y="328" fill="#22c55e" font-family="monospace" font-size="11">Symétrie parfaite !</text>
  </g>

  <!-- Vue 3D du Cylindre extrudé (Centre) -->
  <g transform="translate(340, 60)">
    <!-- Plan de face central semi-transparent -->
    <polygon points="260,80 260,400 240,430 240,110" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="220" y="70" fill="#38bdf8" font-family="monospace" font-size="11">Plan de Face (Origine)</text>

    <!-- Cylindre 3D Extrudé -->
    <defs>
      <linearGradient id="cylShade" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fdba74"/>
        <stop offset="50%" stop-color="#ff7d00"/>
        <stop offset="100%" stop-color="#c2410c"/>
      </linearGradient>
    </defs>

    <!-- Face arrière -->
    <ellipse cx="140" cy="250" rx="45" ry="110" fill="#ea580c" stroke="#ffedd5" stroke-width="1.5"/>

    <!-- Corps cylindrique -->
    <path d="M 140 140 L 360 140 A 45 110 0 0 1 360 360 L 140 360 A 45 110 0 0 1 140 140" fill="url(#cylShade)"/>

    <!-- Face avant -->
    <ellipse cx="360" cy="250" rx="45" ry="110" fill="#fdba74" stroke="#ffffff" stroke-width="2"/>
    <ellipse cx="360" cy="250" rx="3" ry="5" fill="#ef4444"/>

    <!-- Cotes d'extrusion 50 mm -->
    <line x1="140" y1="390" x2="360" y2="390" stroke="#38bdf8" stroke-width="2"/>
    <line x1="140" y1="365" x2="140" y2="405" stroke="#38bdf8" stroke-width="1"/>
    <line x1="360" y1="365" x2="360" y2="405" stroke="#38bdf8" stroke-width="1"/>
    <polygon points="140,390 152,386 152,394" fill="#38bdf8"/>
    <polygon points="360,390 348,386 348,394" fill="#38bdf8"/>
    <text x="230" y="415" fill="#38bdf8" font-family="monospace" font-size="16" font-weight="bold">50.00 mm</text>

    <!-- Cotation diamètre Ø30 mm -->
    <line x1="360" y1="140" x2="430" y2="110" stroke="#f8fafc" stroke-width="1.5"/>
    <text x="440" y="115" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">Ø 30.00</text>
  </g>
</svg>